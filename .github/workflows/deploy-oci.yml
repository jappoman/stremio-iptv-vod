name: deploy-oci

# Deploy the addon to Oracle Cloud "Always Free" with OpenTofu:
# on every push to main (when deploy/oci/** changes) it plans and applies
# VCN + VM (default VM.Standard.E2.1.Micro, free, almost always available;
# for A1: OCI_SHAPE=VM.Standard.A1.Flex + OCI_IS_FLEXIBLE=true) +
# cloud-init (Docker, Caddy, DuckDNS). Can also be triggered manually from
# Actions -> deploy-oci -> Run workflow.
#
# Secrets used (Settings -> Secrets and variables -> Actions -> Secrets):
#   OCI_TENANCY_OCID, OCI_USER_OCID, OCI_FINGERPRINT, OCI_PRIVATE_KEY,
#   OCI_REGION, OCI_ACCESS_KEY, OCI_CUSTOMER_SECRET_KEY, OCI_NAMESPACE,
#   OCI_SSH_PUBLIC_KEY, DUCKDNS_DOMAIN, DUCKDNS_TOKEN
#   (OCI_COMPARTMENT_OCID optional)
# Variables (Variables tab):
#   OCI_SSH_SOURCE_CIDR   your IP/32 for SSH (empty = 0.0.0.0/0)
#   OCI_SHAPE             e.g. VM.Standard.A1.Flex to switch to A1 (2 OCPU/12 GB free)
#   OCI_IS_FLEXIBLE       false when the shape is not flexible (E2.1.Micro)
#   OCI_AVAILABILITY_DOMAIN  to try a specific AD (empty = first AD)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/oci/**'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

# one at a time: two parallel applies on the same state = corruption
concurrency:
  group: oci-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tofu-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      # OCI authentication (API key) + secret sanitization:
      # secrets may contain stray newlines/spaces/TABs from copy-paste,
      # which break URLs and config. Clean values go into $GITHUB_ENV
      # and are reused by all the following steps.
      - name: Configure OCI
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          test -s "$HOME/.oci/oci_api_key.pem" || { echo "::error::OCI_PRIVATE_KEY empty or invalid"; exit 1; }

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user = $(printf '%s' "$OCI_USER_OCID" | tr -d '\r\n \t')
          fingerprint = $(printf '%s' "$OCI_FINGERPRINT" | tr -d '\r\n \t')
          tenancy = $(printf '%s' "$OCI_TENANCY_OCID" | tr -d '\r\n \t')
          region = $(printf '%s' "$OCI_REGION" | tr -d '\r\n \t')
          key_file = /home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

          # clean values for the following steps
          {
            echo "OCI_USER_OCID=$(printf '%s' "$OCI_USER_OCID" | tr -d '\r\n \t')"
            echo "OCI_FINGERPRINT=$(printf '%s' "$OCI_FINGERPRINT" | tr -d '\r\n \t')"
            echo "OCI_TENANCY_OCID=$(printf '%s' "$OCI_TENANCY_OCID" | tr -d '\r\n \t')"
            echo "OCI_REGION=$(printf '%s' "$OCI_REGION" | tr -d '\r\n \t')"
            echo "OCI_NAMESPACE=$(printf '%s' "$OCI_NAMESPACE" | tr -d '\r\n \t')"
            echo "OCI_COMPARTMENT_OCID=$(printf '%s' "${OCI_COMPARTMENT_OCID:-}" | tr -d '\r\n \t')"
            echo "OCI_SSH_PUBLIC_KEY=$(printf '%s' "$OCI_SSH_PUBLIC_KEY" | tr -d '\r\n')"
            echo "OCI_SSH_SOURCE_CIDR=$(printf '%s' "${OCI_SSH_SOURCE_CIDR:-}" | tr -d '\r\n \t')"
            echo "DUCK_DOMAIN=$(printf '%s' "$DUCK_DOMAIN" | tr -d '\r\n \t')"
            echo "DUCK_TOKEN=$(printf '%s' "$DUCK_TOKEN" | tr -d '\r\n')"
            echo "OCI_SHAPE=$(printf '%s' "${OCI_SHAPE:-VM.Standard.E2.1.Micro}" | tr -d '\r\n \t')"
            echo "OCI_IS_FLEXIBLE=$(printf '%s' "${OCI_IS_FLEXIBLE:-false}" | tr -d '\r\n \t')"
            echo "OCI_AD=$(printf '%s' "${OCI_AD:-}" | tr -d '\r\n \t')"
          } >> "$GITHUB_ENV"
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_SSH_SOURCE_CIDR: ${{ vars.OCI_SSH_SOURCE_CIDR }}
          DUCK_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          OCI_SHAPE: ${{ vars.OCI_SHAPE }}
          OCI_IS_FLEXIBLE: ${{ vars.OCI_IS_FLEXIBLE }}
          OCI_AD: ${{ vars.OCI_AVAILABILITY_DOMAIN }}

      # Validates namespace and region (they compose the state endpoint).
      - name: Validate OCI values
        run: |
          echo "namespace = [$OCI_NAMESPACE]"
          echo "region    = [$OCI_REGION]"
          echo "shape     = [$OCI_SHAPE] (is_flexible=$OCI_IS_FLEXIBLE)"
          case "$OCI_NAMESPACE" in
            ""|*[!a-zA-Z0-9-]*) echo "::error::OCI_NAMESPACE invalid: '$OCI_NAMESPACE' (must be alphanumeric, e.g. frmyqwerty12345)"; exit 1;;
          esac
          case "$OCI_REGION" in
            ""|*[!a-z0-9-]*) echo "::error::OCI_REGION invalid: '$OCI_REGION' — lowercase key e.g. eu-milan-1, from https://cloud.oracle.com/?region=<HERE>"; exit 1;;
          esac
          echo "endpoint = https://$OCI_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com"

      # Bucket for the remote state (Object Storage free tier) via OCI CLI.
      - name: Bootstrap state bucket
        run: |
          python3 -m venv /opt/oci-cli
          /opt/oci-cli/bin/pip install --quiet --upgrade pip oci-cli
          /opt/oci-cli/bin/oci os bucket get --name stremio-iptv-vod-tfstate \
            >/dev/null 2>&1 && echo "bucket already exists" || \
            /opt/oci-cli/bin/oci os bucket create --name stremio-iptv-vod-tfstate \
              --compartment-id "$OCI_TENANCY_OCID"

      # tfvars: only user values; shape/is_flexible/AD come from the GitHub
      # Variables (default A1 1 OCPU/6 GB, within the free limit 2/12).
      - name: Write terraform.tfvars
        working-directory: deploy/oci
        run: |
          cat > terraform.tfvars <<EOF
          region          = "$OCI_REGION"
          tenancy_ocid    = "$OCI_TENANCY_OCID"
          compartment_ocid = "$OCI_COMPARTMENT_OCID"
          ssh_public_key  = "$OCI_SSH_PUBLIC_KEY"
          ssh_source_cidr = "${OCI_SSH_SOURCE_CIDR:-0.0.0.0/0}"
          duckdns_domain  = "$DUCK_DOMAIN"
          duckdns_token   = "$DUCK_TOKEN"
          shape           = "$OCI_SHAPE"
          is_flexible     = "$OCI_IS_FLEXIBLE"
          availability_domain = "$OCI_AD"
          EOF

      - name: tofu init (remote state on Object Storage)
        working-directory: deploy/oci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
        run: |
          tofu init -input=false \
            -backend-config="bucket=stremio-iptv-vod-tfstate" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$OCI_REGION" \
            -backend-config="endpoint=https://$OCI_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com"

      - name: tofu plan
        working-directory: deploy/oci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
        run: tofu plan -input=false -out=tfplan

      - name: tofu apply (with retry on Out of host capacity)
        working-directory: deploy/oci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
        run: |
          # GitHub Actions runs with set -e: we disable it to handle failures ourselves
          set +e
          MAX=4
          WAIT=300
          for i in $(seq 1 "$MAX"); do
            echo "--- apply, attempt $i/$MAX"
            OUT=$(tofu apply -input=false -auto-approve tfplan 2>&1)
            CODE=$?
            echo "$OUT"
            if [ "$CODE" -eq 0 ]; then
              echo "APPLY OK"
              exit 0
            fi
            # retry ONLY if it is a (transient) capacity problem
            if ! echo "$OUT" | grep -q "Out of host capacity"; then
              exit "$CODE"
            fi
            if [ "$i" -lt "$MAX" ]; then
              echo "::warning::Out of host capacity — retrying in ${WAIT}s (A1 capacity frees up in waves)..."
              sleep "$WAIT"
            fi
          done
          echo "::error::Capacity unavailable after $MAX attempts (even on E2.1.Micro). Retry later, or change the Availability Domain (Variable OCI_AVAILABILITY_DOMAIN)"
          exit 1
