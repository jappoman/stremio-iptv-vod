name: deploy-oci

# Deploy dell'addon su Oracle Cloud "Always Free" con OpenTofu:
# a ogni push su main (quando cambia deploy/oci/**) pianifica e applica
# VCN + VM A1 (2 OCPU / 12 GB, limite free) + cloud-init (Docker, Caddy,
# DuckDNS). Attivabile anche a mano da Actions → deploy-oci → Run workflow.
#
# Nomi dei secret usati (come creati nel repo):
#   OCI_TENANCY_OCID, OCI_USER_OCID, OCI_FINGERPRINT, OCI_PRIVATE_KEY,
#   OCI_REGION, OCI_ACCESS_KEY, OCI_CUSTOMER_SECRET_KEY, OCI_NAMESPACE,
#   OCI_SSH_PUBLIC_KEY, DUCKDNS_DOMAIN, DUCKDNS_TOKEN
#   (OCI_COMPARTMENT_OCID opzionale)
# Variabile (Settings → Variables): OCI_SSH_SOURCE_CIDR (il tuo IP/32).

on:
  push:
    branches: [main]
    paths:
      - 'deploy/oci/**'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

# uno alla volta: due apply in parallelo sullo stesso stato = corruzione
concurrency:
  group: oci-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tofu-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5

      # Autenticazione OCI tramite API key (config ~/.oci/config)
      - name: Configure OCI API key
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user = $OCI_USER_OCID
          fingerprint = $OCI_FINGERPRINT
          tenancy = $OCI_TENANCY_OCID
          region = $OCI_REGION
          key_file = /home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

      # Bucket per lo stato remoto (Object Storage free tier) via AWS CLI
      # (preinstallata) + endpoint S3-compatibile di OCI.
      - name: Bootstrap state bucket
        run: |
          EP="https://$OCI_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com"
          if ! aws s3api head-bucket --bucket stremio-iptv-vod-tfstate --endpoint-url "$EP" >/dev/null 2>&1; then
            aws s3api create-bucket --bucket stremio-iptv-vod-tfstate --endpoint-url "$EP"
          else
            echo "bucket già esistente"
          fi
        env:
          OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}

      # tfvars: solo i valori utente; shape/ocpus/memory restano i DEFAULT
      # free tier (A1 Flex 2 OCPU / 12 GB) — niente possibilità di sforare.
      # tr -d '\r\n' protegge dagli a-capo finali nei secret.
      - name: Write terraform.tfvars
        working-directory: deploy/oci
        run: |
          cat > terraform.tfvars <<EOF
          region          = "$OCI_REGION"
          tenancy_ocid    = "$OCI_TENANCY_OCID"
          compartment_ocid = "${OCI_COMPARTMENT_OCID:-}"
          ssh_public_key  = "$(printf '%s' "$OCI_SSH_PUBLIC_KEY" | tr -d '\r\n')"
          ssh_source_cidr = "${OCI_SSH_SOURCE_CIDR:-0.0.0.0/0}"
          duckdns_domain  = "$(printf '%s' "$DUCK_DOMAIN" | tr -d '\r\n')"
          duckdns_token   = "$(printf '%s' "$DUCK_TOKEN" | tr -d '\r\n')"
          EOF
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_SSH_SOURCE_CIDR: ${{ vars.OCI_SSH_SOURCE_CIDR }}
          DUCK_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCK_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}

      - name: tofu init (remote state su Object Storage)
        working-directory: deploy/oci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
        run: |
          tofu init -input=false \
            -backend-config="bucket=stremio-iptv-vod-tfstate" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ secrets.OCI_REGION }}" \
            -backend-config="endpoint=https://${{ secrets.OCI_NAMESPACE }}.compat.objectstorage.${{ secrets.OCI_REGION }}.oraclecloud.com"

      - name: tofu plan
        working-directory: deploy/oci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
        run: tofu plan -input=false -out=tfplan

      - name: tofu apply
        working-directory: deploy/oci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_CUSTOMER_SECRET_KEY }}
        run: tofu apply -input=false -auto-approve tfplan
