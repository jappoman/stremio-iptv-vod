# Render Blueprint — free tier deploy with HTTPS included.
# The service starts itself on every push to main. Note: on the free plan
# Render suspends the service after ~15 min of inactivity (the first access
# after wake-up can take up to a minute).
services:
  - type: web
    name: stremio-iptv-vod
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 7000
